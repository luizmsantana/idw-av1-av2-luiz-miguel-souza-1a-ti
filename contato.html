<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bella Massa - Avaliação</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container">

<a class="navbar-brand" href="index.html">Bella Massa</a>

<div class="collapse navbar-collapse show" id="menu">
<ul class="navbar-nav ms-auto">
<li><a class="nav-link" href="index.html">Início</a></li>
<li><a class="nav-link" href="salgadas.html">Salgadas</a></li>
<li><a class="nav-link" href="doces.html">Doces</a></li>
<li><a class="nav-link" href="bebidas.html">Bebidas</a></li>
<li><a class="nav-link active" href="contato.html">Avalie</a></li>
</ul>
</div>

</div>
</nav>
</header>

<main>

<section class="titulo">
<div class="container text-center">
<span class="subtitulo-claro">BELLA MASSA</span>
<h1>Avalie sua experiência</h1>
<p>Sua opinião é muito importante para nós.</p>
</div>
</section>

<section class="container py-5">
<div class="row justify-content-center">
<div class="col-lg-8">

<div class="formulario">

<div class="text-center mb-4">
<span class="subtitulo">CONTE PARA NÓS</span>
<h2>Você gostou da Bella Massa?</h2>
<p>Preencha o formulário abaixo e deixe sua opinião.</p>
</div>

<form>

<div class="row">
<div class="col-md-6 mb-3">
<label for="nome" class="form-label">Nome</label>
<input type="text" class="form-control" id="nome" placeholder="Digite seu nome">
</div>

<div class="col-md-6 mb-3">
<label for="email" class="form-label">E-mail</label>
<input type="email" class="form-control" id="email" placeholder="Digite seu e-mail">
</div>
</div>

<div class="mb-3">
<label for="nota" class="form-label">Nota</label>
<select class="form-select" id="nota">
<option selected>Escolha uma nota</option>
<option>5 - Excelente</option>
<option>4 - Muito bom</option>
<option>3 - Bom</option>
<option>2 - Regular</option>
<option>1 - Ruim</option>
</select>
</div>

<div class="mb-3">
<label for="mensagem" class="form-label">Sua opinião</label>
<textarea class="form-control" id="mensagem" rows="4" placeholder="Conte como foi sua experiência..."></textarea>
</div>

<div class="text-center">
<button type="submit" class="btn btn-principal">Enviar avaliação</button>
</div>

</form>

</div>
</div>
</div>
</section>

</main>

<footer>
<div class="container text-center">
<h5>luiz.m</h5>

</div>
</footer>

</body>
</html>
